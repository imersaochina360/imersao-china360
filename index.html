<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imersão China 360</title>

  <!-- META PIXEL -->
  <script>
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;n=f.fbq=function(){
        n.callMethod ?
        n.callMethod.apply(n,arguments) : n.queue.push(arguments)
      };
      if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];
      t=b.createElement(e);t.async=!0;
      t.src=v;
      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)
    }(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '1246866417395716');
    fbq('track', 'PageView');
  </script>

  <noscript>
    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1246866417395716&ev=PageView&noscript=1"/>
  </noscript>
  <!-- FIM PIXEL -->

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
    }

    /* BANNER */
    .hero {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url('fundo.png') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero h1 {
      font-size: 2.8rem;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 620px;
      margin: auto;
    }

    /* FORMULÁRIO */
    .form-section {
      background: #111;
      padding: 70px 20px;
    }

    .form-section h2 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.3rem;
    }

    .cta-text {
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 25px;
    }

    form {
      max-width: 520px;
      margin: auto;
    }

    label {
      display: block;
      margin: 18px 0 6px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
    }

    button {
      margin-top: 30px;
      width: 100%;
      padding: 16px;
      background: #b00000;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #8a0000;
    }

    .success {
      display: none;
      margin-top: 25px;
      font-size: 1.2rem;
      color: #00ffae;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- BANNER -->
  <section class="hero">
    <div>
      <h1>Imersão China 360</h1>
      <p>
        Descubra a China por trás da Canton Fair com uma experiência estratégica,
        prática e exclusiva para empresários.
      </p>
    </div>
  </section>

  <!-- FORMULÁRIO -->
  <section class="form-section">
    <h2>Garanta sua vaga</h2>
    <div class="cta-text">QUERO PARTICIPAR</div>

    <form id="form" action="https://formspree.io/f/mgvgzgww" method="POST">
      <label>Seu nome</label>
      <input type="text" name="Nome" required>

      <label>Seu e-mail</label>
      <input type="email" name="Email" required>

      <label>Seu telefone (WhatsApp)</label>
      <input type="tel" name="WhatsApp" required>

      <label>Seu nicho ou tipo de produto</label>
      <input type="text" name="Nicho ou Produto" required>

      <label>Você já importa?</label>
      <select name="Já importa?" required>
        <option value="">Selecione</option>
        <option>Sim, já importo</option>
        <option>Não, ainda não importo</option>
        <option>Estou começando</option>
      </select>

      <label>Faturamento da sua empresa</label>
      <select name="Faturamento" required>
        <option value="">Selecione</option>
        <option>Até R$50 mil/mês</option>
        <option>R$50 mil a R$200 mil/mês</option>
        <option>R$200 mil a R$500 mil/mês</option>
        <option>Acima de R$500 mil/mês</option>
      </select>

      <label>Conte sobre o que busca</label>
      <textarea name="Objetivo" rows="4"
        placeholder="Explique brevemente seus objetivos com a Imersão China 360"></textarea>

      <button type="submit">ENVIAR</button>
    </form>

    <div class="success" id="successMsg">
      ✅ Enviado com sucesso!
    </div>
  </section>

  <script>
    const form = document.getElementById('form');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const data = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          successMsg.style.display = 'block';
          form.reset();
          fbq('track', 'Lead');
        } else {
          alert('Erro ao enviar. Tente novamente.');
        }
      } catch (error) {
        alert('Erro de conexão. Tente novamente.');
      }
    });
  </script>

</body>
</html>
