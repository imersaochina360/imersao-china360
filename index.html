<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imersão China 360</title>

  <!-- META PIXEL -->
  <script>
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;n=f.fbq=function(){
        n.callMethod ?
        n.callMethod.apply(n,arguments) : n.queue.push(arguments)
      };
      if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];
      t=b.createElement(e);t.async=!0;
      t.src=v;
      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)
    }(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '1246866417395716');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1246866417395716&ev=PageView&noscript=1"/>
  </noscript>
  <!-- FIM PIXEL -->

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: url('fundo.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      text-align: center;
    }

    .overlay {
      background: rgba(0,0,0,0.6);
      min-height: 100vh;
      padding: 60px 20px;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 30px;
    }

    .cta-text {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    form {
      max-width: 400px;
      margin: 0 auto;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #b00000;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #8a0000;
    }

    .success {
      display: none;
      margin-top: 20px;
      font-size: 1.2rem;
      color: #00ffae;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="overlay">
    <h1>Imersão China 360</h1>
    <p>Descubra a China por trás da Canton Fair com uma experiência estratégica, prática e exclusiva.</p>

    <div class="cta-text">QUERO PARTICIPAR</div>

    <form id="form" action="https://formspree.io/f/mgvgzgww" method="POST">
      <input type="text" name="name" placeholder="Seu nome" required>
      <input type="email" name="email" placeholder="Seu e-mail" required>
      <input type="tel" name="phone" placeholder="WhatsApp" required>

      <button type="submit">ENVIAR</button>
    </form>

    <div class="success" id="successMsg">
      ✅ Enviado com sucesso!
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const data = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          successMsg.style.display = 'block';
          form.reset();
          fbq('track', 'Lead');
        } else {
          alert('Erro ao enviar. Tente novamente.');
        }
      } catch (error) {
        alert('Erro de conexão. Tente novamente.');
      }
    });
  </script>
</body>
</html>
