<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Imersão China 360</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      color: #fff;
      background: #000;
    }

    /* BANNER */
    .hero {
      min-height: 100vh;
      background: 
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url('fundo.png') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: auto;
    }

    /* FORMULÁRIO */
    .form-section {
      background: #111;
      padding: 60px 20px;
    }

    .form-section h2 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.2rem;
    }

    form {
      max-width: 520px;
      margin: auto;
    }

    label {
      display: block;
      margin: 18px 0 6px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
    }

    button {
      margin-top: 30px;
      width: 100%;
      padding: 16px;
      background: #b00000;
      color: #fff;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #8e0000;
    }
  </style>
</head>

<body>

  <!-- BANNER -->
  <section class="hero">
    <div>
      <h1>Imersão China 360</h1>
      <p>
        Descubra a China por trás da Canton Fair com uma experiência estratégica,
        prática e exclusiva para empresários.
      </p>
    </div>
  </section>

  <!-- FORMULÁRIO -->
  <section class="form-section">
    <h2>Garanta sua vaga</h2>

    <form 
      action="https://formsubmit.co/SEUEMAIL@DOMINIO.COM" 
      method="POST"
    >
      <input type="hidden" name="_captcha" value="false">

      <label>Seu nome</label>
      <input type="text" name="Nome" required>

      <label>Seu e-mail</label>
      <input type="email" name="Email" required>

      <label>Seu telefone (WhatsApp)</label>
      <input type="tel" name="WhatsApp" required>

      <label>Seu nicho ou tipo de produto</label>
      <input type="text" name="Nicho ou Produto" required>

      <label>Você já importa?</label>
      <select name="Já importa?" required>
        <option value="">Selecione</option>
        <option>Sim, já importo</option>
        <option>Não, ainda não importo</option>
        <option>Estou começando</option>
      </select>

      <label>Faturamento da sua empresa</label>
      <select name="Faturamento" required>
        <option value="">Selecione</option>
        <option>Até R$50 mil/mês</option>
        <option>R$50 mil a R$200 mil/mês</option>
        <option>R$200 mil a R$500 mil/mês</option>
        <option>Acima de R$500 mil/mês</option>
      </select>

      <label>Conte sobre o que busca</label>
      <textarea 
        name="Objetivo" 
        rows="4" 
        placeholder="Explique brevemente seus objetivos com a Imersão China 360">
      </textarea>

      <button type="submit">ENVIAR</button>
    </form>
  </section>

</body>
</html>
