  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: url('fundo.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }

    .overlay {
      background: rgba(0,0,0,0.65);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 520px;
      padding: 40px 25px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .cta-text {
      font-weight: bold;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    form {
      background: rgba(0,0,0,0.4);
      padding: 25px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #ff0000;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #cc0000;
    }
  </style>

<body>
  <div class="overlay">
    <div class="container">
      <h1>Imersão China 360</h1>
      <p>
        Viva a Canton Fair com estratégia, acesso e visão global de negócios.
      </p>

      <div class="cta-text">QUERO PARTICIPAR</div>

      <form action="https://formsubmit.co/contato@imersaochina360.com.br" method="POST">

        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_subject" value="Novo Lead - Imersão China 360">

        <input type="text" name="name" placeholder="Seu nome" required>
        <input type="email" name="email" placeholder="Seu melhor email" required>
        <input type="tel" name="phone" placeholder="WhatsApp" required>

        <button type="submit">ENVIAR</button>
      </form>
    </div>
  </div>
